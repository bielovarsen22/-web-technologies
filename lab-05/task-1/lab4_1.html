<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>План подорожі</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>План подорожі:</h1>
        
        <ul class="level-1">
            <!-- Клас іконки для 1-го рівня (checklist) -->
            <li class="icon-checklist">
                <span>Підготовчий етап</span>
                <ul class="level-2">
                    <!-- Класи іконок для 2-го рівня -->
                    <li class="icon-phone"><span>Обрати маршрут</span></li>
                    <li class="icon-plane"><span>Квитки на літак</span></li>
                    <li class="icon-hotel"><span>Готель</span></li>
                    <li class="icon-car"><span>Оренда авто</span></li>
                </ul>
            </li>
        </ul>
        <ul class="level-1">
            <li class="icon-checklist">
                <span>Відпочинок</span>
                <ul class="level-2">
                    <li class="icon-bar"><span>Бари</span></li>
                    <li class="icon-casino"><span>Казино</span></li>
                    <li class="icon-museum"><span>Музеї</span></li>
                    <li class="icon-festival"><span>Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>

</body>
</html>
